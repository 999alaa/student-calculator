<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Calculator</h1>

        <div class="menu">
            <button onclick="showSection('calculator')">Calculator</button>
            <button onclick="showSection('grades')">Grade Calculator</button>
        </div>

        <div id="calculator" class="section">

            <h2>Simple Calculator</h2>

            <input type="text" id="display" readonly>

            <div class="buttons">

                <button onclick="clearDisplay()">C</button>
                <button onclick="deleteLast()">DEL</button>
                <button onclick="addToDisplay('/')">/</button>
                <button onclick="addToDisplay('*')">*</button>

                <button onclick="addToDisplay('7')">7</button>
                <button onclick="addToDisplay('8')">8</button>
                <button onclick="addToDisplay('9')">9</button>
                <button onclick="addToDisplay('-')">-</button>

                <button onclick="addToDisplay('4')">4</button>
                <button onclick="addToDisplay('5')">5</button>
                <button onclick="addToDisplay('6')">6</button>
                <button onclick="addToDisplay('+')">+</button>

                <button onclick="addToDisplay('1')">1</button>
                <button onclick="addToDisplay('2')">2</button>
                <button onclick="addToDisplay('3')">3</button>
                <button onclick="calculate()">=</button>

                <button onclick="addToDisplay('0')">0</button>
                <button onclick="addToDisplay('.')">.</button>

            </div>

        </div>


        <div id="grades" class="section hidden">

            <h2>Grade Calculator</h2>

            <input type="text" id="studentName" placeholder="Student Name">

            <input type="number" id="grade1" placeholder="Grade 1">

            <input type="number" id="grade2" placeholder="Grade 2">

            <input type="number" id="grade3" placeholder="Grade 3">

            <button onclick="calculateGrades()">Calculate Grades</button>

            <div id="result"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
